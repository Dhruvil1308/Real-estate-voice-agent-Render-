# render.yaml — Render Blueprint for Real Estate Voice Agent
# Deploy: Connect your GitHub repo to Render, it will auto-detect this file.

services:
  - type: web
    name: real-estate-voice-agent
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.12"
      - key: VOBIZ_AUTH_ID
        sync: false   # Set manually in Render dashboard
      - key: VOBIZ_AUTH_TOKEN
        sync: false
      - key: VOBIZ_FROM_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: TRANSFER_NUMBERS
        sync: false   # Multiple numbers separated by commas
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: BASE_URL
        sync: false   # Set to your Render URL: https://real-estate-voice-agent.onrender.com
